<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1140" viewBox="0 0 1440 1140" role="img" aria-labelledby="title desc"><title id="title">S500 vision control architecture</title><desc id="desc">Detect directly implements USB camera capture, OpenVINO detection, tracking, locked target selection, yaw control, safety checks and MAVLink setpoint streaming to PX4. It does not arm or take off. Companion is a separate package: USB telemetry and local vision packets feed FlightGuard and its safety supervisor. Shadow mode uses no control transport. The explicit SITL runner is separate; default hardware control_enabled and allow_serial_control are false and ai_enable_rc_channel is zero. No integrated Detect-to-Companion packet sender is claimed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker></defs><rect width="1440" height="1140" fill="#f8fbfe"/><text x="64" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#142b43" text-anchor="start">S500 vision and control architecture</text><text x="64" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Two independent modules: a vision-yaw app and a companion validation package</text><rect x="50" y="145" width="920" height="502" rx="24" fill="#f0f7fa" stroke="#d6e2ed" stroke-width="2" /><text x="80" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#142b43" text-anchor="start">Detect / follow</text><rect x="80" y="220" width="250" height="142" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" /><path d="M100 220 H310" stroke="#087f8c" stroke-width="5"/><text x="104" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#142b43" text-anchor="start">USB camera</text><text x="104" y="300" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Rotate at source</text><text x="104" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Fresh frame + seq</text><rect x="375" y="220" width="275" height="142" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" /><path d="M395 220 H630" stroke="#087f8c" stroke-width="5"/><text x="399" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#142b43" text-anchor="start">Detect + track</text><text x="399" y="300" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">OpenVINO YOLO</text><text x="399" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">GMC + ByteTrack-style</text><rect x="695" y="220" width="245" height="142" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" /><path d="M715 220 H920" stroke="#087f8c" stroke-width="5"/><text x="719" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#142b43" text-anchor="start">Locked target</text><text x="719" y="300" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Operator selects ID</text><text x="719" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Reconfirm after loss</text><path d="M338 289 L365 289" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M658 289 L685 289" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M815 374V400H325V430" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)" /><rect x="80" y="444" width="510" height="143" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" /><path d="M100 444 H570" stroke="#087f8c" stroke-width="5"/><text x="104" y="484" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#142b43" text-anchor="start">YawController + safety gate</text><text x="104" y="524" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Freshness, fence, battery, RC and operator</text><text x="104" y="555" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Watchdogs, clamp, EKF reset and command audit</text><rect x="678" y="444" width="262" height="143" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" /><path d="M698 444 H920" stroke="#087f8c" stroke-width="5"/><text x="702" y="484" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#142b43" text-anchor="start">PX4 link + TX</text><text x="702" y="524" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">20 Hz setpoint stream</text><text x="702" y="555" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Yaw + position hold</text><path d="M603 515 L666 515" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="606" width="806" height="34" rx="17" fill="#f0f7fa" stroke="none" stroke-width="2" /><text x="96" y="630" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#087f8c" text-anchor="start">Operator: target selection + web dead-man + independent RC consent</text><rect x="1070" y="355" width="310" height="260" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" /><path d="M1090 355 H1360" stroke="#087f8c" stroke-width="5"/><text x="1094" y="395" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#142b43" text-anchor="start">Pixhawk / PX4</text><text x="1094" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">MAVLink telemetry</text><text x="1094" y="466" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Yaw-only Offboard input</text><text x="1094" y="497" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Position hold / abort mode</text><text x="1094" y="528" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Pilot owns arm and takeoff</text><path d="M981 494 L1058 494" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="1020" y="477" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#087f8c" text-anchor="middle">MAVLink</text><path d="M1058 560H981" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)" /><text x="1020" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#087f8c" text-anchor="middle">State</text><rect x="50" y="735" width="920" height="312" rx="24" fill="#f0f7fa" stroke="#d6e2ed" stroke-width="2" /><text x="80" y="780" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#142b43" text-anchor="start">Companion / s500_companion</text><rect x="80" y="810" width="285" height="210" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" /><path d="M100 810 H345" stroke="#087f8c" stroke-width="5"/><text x="104" y="850" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#142b43" text-anchor="start">Inputs</text><text x="104" y="890" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">USB telemetry (read only)</text><text x="104" y="921" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Local vision packet contract</text><text x="104" y="952" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">127.0.0.1:5800 UDP</text><text x="104" y="983" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">External packet producer</text><rect x="410" y="810" width="530" height="210" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" /><path d="M430 810 H920" stroke="#087f8c" stroke-width="5"/><text x="434" y="850" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#142b43" text-anchor="start">FlightGuard + safety supervisor</text><text x="434" y="890" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Validate packet freshness and RC consent</text><text x="434" y="921" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Yaw limiter + soft fence + output owner</text><text x="434" y="952" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Shadow: transport=None, JSONL logs</text><text x="434" y="983" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">SITL: separately enabled yaw-only runner</text><path d="M376 915 L398 915" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M1225 628V689H28V915H68" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)" /><text x="698" y="715" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#087f8c" text-anchor="start">USB telemetry</text><rect x="1028" y="785" width="352" height="234" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" stroke-dasharray="7 7"/><text x="1051" y="830" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#142b43" text-anchor="start">Hardware defaults</text><text x="1051" y="875" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="20" font-weight="400" fill="#50657a" text-anchor="start">control_enabled=false</text><text x="1051" y="912" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="18" font-weight="400" fill="#50657a" text-anchor="start">allow_serial_control=false</text><text x="1051" y="949" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="20" font-weight="400" fill="#50657a" text-anchor="start">ai_enable_rc_channel=0</text><text x="1051" y="992" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#50657a" text-anchor="start">Read-only / shadow by default</text><text x="64" y="1098" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Detect and Companion are separate paths; no built-in Detect-to-Companion UDP sender is shown.</text></svg>