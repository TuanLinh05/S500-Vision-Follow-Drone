<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="915" viewBox="0 0 1420 915" role="img" aria-labelledby="title desc"><title id="title">S500 validation workflow</title><desc id="desc">Stage one runs offline Detect and Companion software tests and camera model dry runs. Stage two discovers and probes read-only USB MAVLink, records and validates telemetry, audits parameters and records shadow supervision. Stage three uses Gazebo and PX4 SITL for an explicitly enabled yaw-only runner and RC, operator-loss and watchdog cases. Stage four is a propellers-removed, disarmed-only POSITION mode command test with ACK and heartbeat checks that restores the original mode. Later planned gates include bench override and geofence checks, two read-only shadow flights and a reviewed yaw-only release. Stage presence does not claim PASS or flight readiness.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker></defs><rect width="1420" height="915" fill="#f8fbfe"/><text x="64" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#142b43" text-anchor="start">Validation workflow</text><text x="64" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Repository tools support staged checks; a diagram does not establish test completion</text><rect x="64" y="154" width="287" height="405" rx="20" fill="#edf6ff" stroke="#d6e2ed" stroke-width="2" /><text x="88" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#087f8c" text-anchor="start">01</text><text x="88" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#142b43" text-anchor="start">Offline software</text><rect x="88" y="286" width="239" height="34" rx="17" fill="#f0f7fa" stroke="none" stroke-width="2" /><text x="104" y="310" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#087f8c" text-anchor="start">No vehicle I/O</text><text x="88" y="369" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Detect pytest suite</text><text x="88" y="414" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Companion unittest suite</text><text x="88" y="459" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Camera + model dry run</text><text x="88" y="504" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Fake PX4 / fault tests</text><rect x="399" y="154" width="287" height="405" rx="20" fill="#ecfaf6" stroke="#d6e2ed" stroke-width="2" /><text x="423" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#087f8c" text-anchor="start">02</text><text x="423" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#142b43" text-anchor="start">Read-only USB</text><rect x="423" y="286" width="239" height="34" rx="17" fill="#f0f7fa" stroke="none" stroke-width="2" /><text x="439" y="310" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#087f8c" text-anchor="start">P1 / P2 / shadow</text><text x="423" y="369" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Discover + probe Pixhawk</text><text x="423" y="414" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Record 30-minute telemetry</text><text x="423" y="459" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Validate logs and params</text><text x="423" y="504" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Shadow supervision logs</text><rect x="734" y="154" width="287" height="405" rx="20" fill="#edf6ff" stroke="#d6e2ed" stroke-width="2" /><text x="758" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#087f8c" text-anchor="start">03</text><text x="758" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#142b43" text-anchor="start">PX4 SITL</text><rect x="758" y="286" width="239" height="34" rx="17" fill="#f0f7fa" stroke="none" stroke-width="2" /><text x="774" y="310" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#087f8c" text-anchor="start">P4 / fault cases</text><text x="758" y="369" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Gazebo S500 + PX4</text><text x="758" y="414" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Pilot prepares hover</text><text x="758" y="459" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Explicit yaw-only runner</text><text x="758" y="504" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">RC / operator / watchdog</text><rect x="1069" y="154" width="287" height="405" rx="20" fill="#ecfaf6" stroke="#d6e2ed" stroke-width="2" /><text x="1093" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#087f8c" text-anchor="start">04</text><text x="1093" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#142b43" text-anchor="start">Disarmed bench</text><rect x="1093" y="286" width="239" height="34" rx="17" fill="#f0f7fa" stroke="none" stroke-width="2" /><text x="1109" y="310" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#087f8c" text-anchor="start">P5a mode test</text><text x="1093" y="369" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Props removed confirmed</text><text x="1093" y="414" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">POSITION mode request</text><text x="1093" y="459" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">ACK + heartbeat check</text><text x="1093" y="504" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Restore original mode</text><path d="M362 355 L389 355" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M697 355 L724 355" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M1032 355 L1059 355" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="604" width="1292" height="216" rx="24" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" stroke-dasharray="8 7"/><text x="94" y="653" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#142b43" text-anchor="start">Further field validation in the project plan</text><text x="94" y="693" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#087f8c" text-anchor="start">P5 bench checks</text><text x="94" y="730" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">RC override, Position/RTL, geofence</text><text x="574" y="693" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#087f8c" text-anchor="start">P6 shadow flights</text><text x="574" y="730" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Two flights with no control output</text><text x="1054" y="693" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#087f8c" text-anchor="start">P7 reviewed yaw-only</text><text x="1054" y="730" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Parameter review</text><text x="1054" y="760" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">+ PIC approval</text><path d="M472 703 L560 703" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M948 703 L1040 703" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="94" y="786" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Planned release gates. Unit tests and a disarmed mode test do not demonstrate flight readiness.</text><text x="64" y="875" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Artifacts: telemetry CSV/JSONL, validation JSON, parameter audit and fault-case logs.</text></svg>